<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex,nofollow">
  <title>تعيين كلمة مرور جديدة | تياترو الصعيد</title>
  <style>
    :root{color-scheme:dark;--navy:#0b1830;--blue:#244b86;--white:#f7f9fc;--muted:#b9c5d8}
    *{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:20px;background:linear-gradient(145deg,#07111f,#142b4b);font-family:system-ui,-apple-system,"Segoe UI",Tahoma,sans-serif;color:var(--white)}
    main{width:min(100%,460px);background:#101e33;border:1px solid #314766;border-radius:20px;padding:28px;box-shadow:0 20px 60px #0005}
    h1{font-size:1.6rem;margin:0 0 10px}p{color:var(--muted);line-height:1.8}
    label{display:block;margin:18px 0 8px}input{width:100%;padding:13px;border-radius:10px;border:1px solid #49617f;background:#081426;color:white;font:inherit}
    button{width:100%;margin-top:22px;padding:14px;border:0;border-radius:10px;background:#d8e5ff;color:#102343;font:inherit;font-weight:700;cursor:pointer}
    button:disabled{opacity:.6;cursor:wait}.status{margin-top:16px;padding:12px;border-radius:10px;display:none;line-height:1.7}.status.show{display:block}.status.error{background:#4b2028;color:#ffe1e5}.status.ok{background:#173e35;color:#d7fff1}
    .brand{font-size:.9rem;color:#b9c5d8;margin-bottom:22px}a{color:#c8dcff}
  </style>
</head>
<body>
<main>
  <div class="brand">تياترو الصعيد للفنون الأدائية</div>
  <h1>تعيين كلمة مرور جديدة</h1>
  <p>اكتب كلمة مرور جديدة لحساب إدارة منصة فنون الصعيد. افتح هذه الصفحة من رابط الاستعادة الذي وصلك على البريد الإلكتروني.</p>
  <form id="reset-form">
    <label for="password">كلمة المرور الجديدة</label>
    <input id="password" type="password" autocomplete="new-password" minlength="8" required placeholder="٨ أحرف على الأقل">
    <label for="confirm">تأكيد كلمة المرور</label>
    <input id="confirm" type="password" autocomplete="new-password" minlength="8" required placeholder="اكتب كلمة المرور مرة أخرى">
    <button id="submit" type="submit">حفظ كلمة المرور</button>
  </form>
  <div id="status" class="status" role="status" aria-live="polite"></div>
  <p><a href="/admin-artists.html">العودة إلى لوحة إدارة الفنانين</a></p>
</main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
(() => {
  const SUPABASE_URL = 'https://rwnxofwchajpnatvzzwe.supabase.co';
  const SUPABASE_PUBLISHABLE_KEY = 'sb_publishable_TaeGmT2KO8I8iG0SbV1Q2A_L1t4sldQ';
  const statusBox = document.getElementById('status');
  const form = document.getElementById('reset-form');
  const submit = document.getElementById('submit');
  const say = (message, kind) => {
    statusBox.textContent = message;
    statusBox.className = 'status show ' + kind;
  };
  const params = new URLSearchParams(location.hash.slice(1));
  const query = new URLSearchParams(location.search);
  const recoveryError = params.get('error_description') || query.get('error_description');
  if (recoveryError) say('رابط الاستعادة غير صالح أو انتهت صلاحيته. اطلب رسالة استعادة جديدة.', 'error');
  const client = window.supabase.createClient(SUPABASE_URL, SUPABASE_PUBLISHABLE_KEY);
  form.addEventListener('submit', async (event) => {
    event.preventDefault();
    const password = document.getElementById('password').value;
    const confirm = document.getElementById('confirm').value;
    if (password.length < 8) return say('كلمة المرور يجب ألا تقل عن ٨ أحرف.', 'error');
    if (password !== confirm) return say('كلمتا المرور غير متطابقتين.', 'error');
    submit.disabled = true;
    submit.textContent = 'جارٍ الحفظ…';
    try {
      const { data, error } = await client.auth.updateUser({ password });
      if (error) throw error;
      if (!data.user) throw new Error('انتهت صلاحية رابط الاستعادة. اطلب رابطًا جديدًا.');
      say('تم تغيير كلمة المرور بنجاح. يمكنك الآن تسجيل الدخول إلى لوحة الإدارة.', 'ok');
      form.reset();
    } catch (error) {
      say(error.message || 'تعذر تغيير كلمة المرور. تأكد من صلاحية رابط الاستعادة وحاول مرة أخرى.', 'error');
    } finally {
      submit.disabled = false;
      submit.textContent = 'حفظ كلمة المرور';
    }
  });
})();
</script>
</body>
</html>
