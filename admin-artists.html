<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>إدارة منصة فنون الصعيد | تياترو الصعيد</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#080909;--panel:#111414;--line:rgba(255,255,255,.13);--teal:#2bb3b1;--muted:#a8aeae}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:#fff;font-family:Cairo,sans-serif;line-height:1.7}.wrap{width:min(1100px,calc(100% - 28px));margin:32px auto}.top{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:24px}h1{font-size:clamp(25px,4vw,38px);margin:0}h2{margin:0 0 14px}.muted{color:var(--muted);font-size:14px}.panel{background:var(--panel);border:1px solid var(--line);padding:22px;border-radius:8px;margin:18px 0}.field{display:block;width:100%;padding:12px;background:#090b0b;color:#fff;border:1px solid var(--line);border-radius:4px;font:inherit;margin:7px 0 14px}.btn{border:1px solid var(--line);background:transparent;color:#fff;border-radius:4px;padding:10px 16px;font:inherit;font-weight:700;cursor:pointer}.btn.primary{background:var(--teal);border-color:var(--teal);color:#061010}.btn:disabled{opacity:.5;cursor:wait}.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}.hidden{display:none!important}.message{padding:12px;background:rgba(43,179,177,.1);border-right:3px solid var(--teal);margin:12px 0;font-size:14px;white-space:pre-wrap}.cards{display:grid;gap:14px}.item{border:1px solid var(--line);padding:18px;border-radius:6px}.item h3{margin:0 0 5px}.meta{color:var(--muted);font-size:13px}.tags{display:flex;gap:6px;flex-wrap:wrap;margin:10px 0}.tag{border:1px solid var(--line);padding:2px 8px;font-size:12px}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}.approve{border-color:#4ba783;color:#81e2b8}.reject{border-color:#d86c6c;color:#ff9b9b}.pending{color:#f3d28a}.empty{text-align:center;color:var(--muted);padding:28px;border:1px dashed var(--line)}a{color:var(--teal)}textarea.field{min-height:72px}
</style>
</head>
<body><main class="wrap">
<header class="top"><div><div class="muted">تياترو الصعيد · Arts of Upper Egypt</div><h1>لوحة إدارة الفنانين</h1></div><div class="row"><a href="/artists">عرض الدليل</a><button id="logout" class="btn hidden">تسجيل الخروج</button></div></header>
<section id="loginPanel" class="panel"><h2>دخول الإدارة</h2><p class="muted">الدخول متاح لحسابات الإدارة المعتمدة فقط.</p><form id="loginForm"><label for="email">البريد الإلكتروني</label><input class="field" id="email" type="email" autocomplete="username" required value="teatroalsaeed.info@gmail.com"><label for="password">كلمة المرور</label><input class="field" id="password" type="password" autocomplete="current-password" required><button class="btn primary" type="submit">تسجيل الدخول</button></form><button id="forgotPassword" class="btn" type="button" style="margin-top:12px">نسيت كلمة المرور؟ أرسل رابط استعادة</button><div id="loginMsg" class="message hidden"></div></section>
<section id="dashboard" class="hidden"><div class="panel"><div class="top"><div><h2>طلبات الفنانين</h2><div class="muted">راجع البيانات قبل الموافقة على نشرها.</div></div><div class="row"><select id="statusFilter" class="field" style="width:auto;margin:0"><option value="pending">قيد المراجعة</option><option value="approved">مقبولة</option><option value="rejected">مرفوضة</option><option value="all">كل الطلبات</option></select><button id="refresh" class="btn">تحديث</button></div></div><div id="dashMsg" class="message hidden"></div><div id="requests" class="cards"><div class="empty">جارٍ تحميل الطلبات…</div></div></div></section>
</main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
(function(){
 const client=window.supabase.createClient('https://rwnxofwchajpnatvzzwe.supabase.co','sb_publishable_TaeGmT2KO8I8iG0SbV1Q2A_L1t4sldQ');
 const $=id=>document.getElementById(id);
 const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
 function msg(id,text){$(id).textContent=text;$(id).classList.remove('hidden')}
 function statusLabel(s){return ({pending:'قيد المراجعة',approved:'مقبول',rejected:'مرفوض'})[s]||s;}
 async function checkSession(){
  const {data:{session}}=await client.auth.getSession();
  if(!session){$('loginPanel').classList.remove('hidden');$('dashboard').classList.add('hidden');$('logout').classList.add('hidden');return}
  const {data:admin,error}=await client.from('artist_directory_admins').select('user_id').eq('user_id',session.user.id).maybeSingle();
  if(error||!admin){await client.auth.signOut();$('loginPanel').classList.remove('hidden');$('dashboard').classList.add('hidden');msg('loginMsg','هذا الحساب ليس ضمن حسابات الإدارة المعتمدة.');return}
  $('loginPanel').classList.add('hidden');$('dashboard').classList.remove('hidden');$('logout').classList.remove('hidden');await loadRequests();
 }
 $('loginForm').addEventListener('submit',async e=>{e.preventDefault();const b=e.submitter;b.disabled=true;$('loginMsg').classList.add('hidden');try{const {error}=await client.auth.signInWithPassword({email:$('email').value.trim(),password:$('password').value});if(error)throw error;await checkSession()}catch(error){msg('loginMsg','تعذر تسجيل الدخول: '+(error.message||'خطأ غير معروف')+' — تأكد من البريد وكلمة المرور.');}finally{b.disabled=false}});
 $('forgotPassword').addEventListener('click',async()=>{const email=$('email').value.trim();if(!email){msg('loginMsg','اكتب البريد الإلكتروني أولًا.');$('email').focus();return}const b=$('forgotPassword');b.disabled=true;b.textContent='جارٍ إرسال الرابط…';$('loginMsg').classList.add('hidden');try{const {error}=await client.auth.resetPasswordForEmail(email,{redirectTo:'https://teatroalsaeed.org/reset-password.html'});if(error)throw error;msg('loginMsg','تم طلب رابط الاستعادة. افحص البريد الوارد ومجلد الرسائل غير المرغوب فيها. إذا لم تصل رسالة، فقد يكون هناك حد مؤقت للإرسال.');}catch(error){msg('loginMsg','تعذر إرسال رابط الاستعادة: '+(error.message||'خطأ غير معروف')+'. لا تكرر المحاولة؛ انتظر قليلًا ثم حاول مرة واحدة.');}finally{b.disabled=false;b.textContent='نسيت كلمة المرور؟ أرسل رابط استعادة';}});
 $('logout').addEventListener('click',async()=>{await client.auth.signOut();await checkSession()});
 $('refresh').addEventListener('click',loadRequests);$('statusFilter').addEventListener('change',loadRequests);
 async function loadRequests(){
  $('requests').innerHTML='<div class="empty">جارٍ تحميل الطلبات…</div>';$('dashMsg').classList.add('hidden');
  let q=client.from('artist_submissions').select('id,created_at,status,full_name,artist_name,email,governorate,disciplines,bio,portfolio_url,social_url,work_links,cv_path,portrait_path,portrait_public_path,portrait_publication_accepted_at,admin_notes').order('created_at',{ascending:false}).limit(200);
  const filter=$('statusFilter').value;if(filter!=='all')q=q.eq('status',filter);
  const {data,error}=await q;if(error){msg('dashMsg','تعذر تحميل الطلبات. تأكد من تسجيل الدخول وصلاحيات الإدارة.');$('requests').innerHTML='';return}
  if(!data||!data.length){$('requests').innerHTML='<div class="empty">لا توجد طلبات في هذه القائمة.</div>';return}
  $('requests').innerHTML=data.map(a=>'<article class="item"><div class="row" style="justify-content:space-between"><h3>'+esc(a.artist_name||a.full_name)+'</h3><span class="pending">'+esc(statusLabel(a.status))+'</span></div><div class="meta">'+esc(a.full_name)+' · '+esc(a.email)+' · '+esc(a.governorate)+' · '+esc(new Date(a.created_at).toLocaleString('ar-EG'))+'</div><div class="tags">'+(a.disciplines||[]).map(d=>'<span class="tag">'+esc(d)+'</span>').join('')+'</div><p>'+esc(a.bio)+'</p>'+(a.portfolio_url?'<p><a href="'+esc(a.portfolio_url)+'" target="_blank" rel="noopener noreferrer">رابط الأعمال ↗</a></p>':'')+(a.social_url?'<p><a href="'+esc(a.social_url)+'" target="_blank" rel="noopener noreferrer">الرابط المهني ↗</a></p>':'')+((a.work_links||[]).length?'<p>'+(a.work_links||[]).map((u,i)=>'<a href="'+esc(u)+'" target="_blank" rel="noopener noreferrer">عمل '+(i+1)+' ↗</a>').join(' · ')+'</p>':'')+((a.portrait_path||a.cv_path)?'<div class="attachments" style="margin:14px 0;padding:12px;border:1px solid var(--line);border-radius:4px"><strong>الملفات المرفقة</strong>'+(a.portrait_path?'<p><img alt="صورة الفنان" data-private-image data-file-path="'+esc(a.portrait_path)+'" style="display:none;max-width:150px;max-height:180px;object-fit:cover;border-radius:6px"></p>':'')+(a.portrait_path?'<p><a data-private-link data-file-path="'+esc(a.portrait_path)+'" target="_blank" rel="noopener noreferrer" style="display:none">فتح الصورة الشخصية ↗</a></p>':'')+(a.cv_path?'<p><a data-private-link data-file-path="'+esc(a.cv_path)+'" target="_blank" rel="noopener noreferrer" style="display:none">فتح السيرة الذاتية (PDF) ↗</a></p>':'')+'</div>':'')+'<label>ملاحظات الإدارة<textarea class="field notes" data-id="'+esc(a.id)+'">'+esc(a.admin_notes||'')+'</textarea></label><div class="actions">'+(a.status!=='approved'?'<button class="btn approve" data-action="approved" data-id="'+esc(a.id)+'">موافقة ونشر</button>':'')+(a.status!=='rejected'?'<button class="btn reject" data-action="rejected" data-id="'+esc(a.id)+'">رفض الطلب</button>':'')+(a.status!=='pending'?'<button class="btn" data-action="pending" data-id="'+esc(a.id)+'">إعادة للمراجعة</button>':'')+'<button class="btn" data-action="notes" data-id="'+esc(a.id)+'">حفظ الملاحظات</button></div></article>').join('');
  const fileElements=[...$('requests').querySelectorAll('[data-file-path]')];
  await Promise.all(fileElements.map(async el=>{
    const {data,error}=await client.storage.from('artist-submissions').createSignedUrl(el.dataset.filePath,60*10);
    if(error||!data?.signedUrl)return;
    if(el.hasAttribute('data-private-image')){el.src=data.signedUrl;el.style.display='block';}
    else {el.href=data.signedUrl;el.style.display='inline';}
  }));
 }
 $('requests').addEventListener('click',async e=>{const b=e.target.closest('button[data-action]');if(!b)return;const id=b.dataset.id,action=b.dataset.action;b.disabled=true;
  const {data:{user}}=await client.auth.getUser();if(!user){b.disabled=false;await checkSession();return}
  const notes=document.querySelector('.notes[data-id="'+CSS.escape(id)+'"]').value.trim()||null;
  try{
   let portraitPublicPath;
   if(action==='approved'){
    const {data:record,error:readError}=await client.from('artist_submissions').select('portrait_path,portrait_public_path,portrait_publication_accepted_at').eq('id',id).single();
    if(readError)throw readError;
    portraitPublicPath=record.portrait_public_path||null;
    if(record.portrait_path && record.portrait_publication_accepted_at){
     const ext=(record.portrait_path.split('.').pop()||'jpg').toLowerCase();
     const safeExt=['jpg','jpeg','png','webp'].includes(ext)?ext:'jpg';
     const publicPath='approved/'+id+'.'+safeExt;
     const {data:signed,error:signedError}=await client.storage.from('artist-submissions').createSignedUrl(record.portrait_path,600);
     if(signedError||!signed?.signedUrl)throw signedError||new Error('تعذر إنشاء رابط الصورة الخاصة');
     const imageResponse=await fetch(signed.signedUrl);
     if(!imageResponse.ok)throw new Error('تعذر قراءة الصورة المرفقة');
     const blob=await imageResponse.blob();
     const {error:uploadError}=await client.storage.from('artist-portraits-public').upload(publicPath,blob,{upsert:true,contentType:blob.type||('image/'+(safeExt==='jpg'?'jpeg':safeExt)),cacheControl:'3600'});
     if(uploadError)throw uploadError;
     portraitPublicPath=publicPath;
    }
   }
   const payload=action==='notes'?{admin_notes:notes,updated_at:new Date().toISOString()}:{status:action,updated_at:new Date().toISOString(),admin_notes:notes,...(action==='approved'?{portrait_public_path:portraitPublicPath||null}:{})};
   const {error}=await client.from('artist_submissions').update(payload).eq('id',id);if(error)throw error;
   if(action==='rejected'||action==='pending'){
    const {data:record}=await client.from('artist_submissions').select('portrait_public_path').eq('id',id).single();
    if(record?.portrait_public_path){
     const {error:removeError}=await client.storage.from('artist-portraits-public').remove([record.portrait_public_path]);
     if(removeError)console.warn('Could not remove public portrait:',removeError.message);
     await client.from('artist_submissions').update({portrait_public_path:null}).eq('id',id);
    }
   }
   msg('dashMsg',action==='approved'?'تم اعتماد الملف ونشر الصورة الشخصية في الدليل العام إن وُجدت.':action==='rejected'?'تم تحديث حالة الطلب إلى مرفوض.':action==='pending'?'أُعيد الطلب إلى المراجعة وأُخفيت الصورة العامة.':'تم حفظ الملاحظات.');
   await loadRequests();
  }catch(error){msg('dashMsg','لم يتم إكمال العملية: '+(error.message||'خطأ غير معروف')+'. لم يتم تأكيد اعتماد الملف.');}
  finally{b.disabled=false;}
 });
 client.auth.onAuthStateChange(()=>{});
 checkSession();
})();
</script></body></html>
