name: Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - feature/android-app-foundation
      - feature/app-activities-and-content
  pull_request:
    branches:
      - feature/android-app-foundation
    paths:
      - "mobile/**"
      - ".github/workflows/android-apk.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Generate Android platform files
        working-directory: mobile
        run: flutter create --platforms=android --org org.teatroalsaeed .

      - name: Ensure Android internet permission
        working-directory: mobile
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          manifest = Path("android/app/src/main/AndroidManifest.xml")
          content = manifest.read_text()
          permission = '    <uses-permission android:name="android.permission.INTERNET"/>'
          if "android.permission.INTERNET" not in content:
              content = re.sub(r"(<application\\b)", permission + r"\\n    \\1", content, count=1)
              manifest.write_text(content)
          if "android.permission.INTERNET" not in manifest.read_text():
              raise SystemExit("INTERNET permission was not added to the release manifest")
          print("Verified INTERNET permission in Android main manifest")
          PY

      - name: Install dependencies
        working-directory: mobile
        run: flutter pub get

      - name: Analyze Dart code
        working-directory: mobile
        run: flutter analyze

      - name: Run widget tests
        working-directory: mobile
        run: flutter test

      - name: Build release APK
        working-directory: mobile
        run: flutter build apk --release

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: teatro-alsaeed-android-apk
          path: mobile/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
